[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@uniswap/v4-core/=lib/v4-core/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 10000

[profile.default.invariant]
runs = 256
depth = 100
fail_on_revert = true

[profile.ci.fuzz]
runs = 100000

[profile.ci.invariant]
runs = 1024
depth = 200

[fmt]
line_length = 100

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
local = "http://127.0.0.1:8545"

[etherscan]
robinhood = { key = "blockscout", chain = 4663, url = "https://robinhoodchain.blockscout.com/api/" }
robinhood_testnet = { key = "blockscout", chain = 46630, url = "https://explorer.testnet.chain.robinhood.com/api/" }
